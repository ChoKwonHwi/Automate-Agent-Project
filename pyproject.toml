[project]
name = "policy-copilot"
version = "0.1.0"
description = "사내 규정 Q&A 및 업무 실행 Agent"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pymupdf>=1.24",
    "olefile>=0.47",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingestion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
